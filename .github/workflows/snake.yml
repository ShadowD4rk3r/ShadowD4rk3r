name: Generate Snake

on:
  # Run automatically every 24 hours
  schedule:
    - cron: "0 0 * * *"
  
  # Allows to manually run the job at any time
  workflow_dispatch:
  
  # Run on every push on the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Generates the snake animation SVGs into the dist folder
      - name: Generate contribution snake animation
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ShadowD4rk3r
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/icarus-snake.svg?color_snake=#D4AF37&color_dots=#111111,#332200,#664400,#996600,#D4AF37
          
      # 2. Push the generated files to the 'output' branch
      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
